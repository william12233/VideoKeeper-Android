name: Signed APK Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要發布的既有 tag，例如 v1.0.0'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Validate signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS" && test -n "$KSP" && test -n "$KA" && test -n "$KP" || { echo 'Missing Android signing secrets'; exit 1; }
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            test -n "$INPUT_TAG"
            git fetch --tags --force
            git rev-parse "refs/tags/$INPUT_TAG" >/dev/null
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore signing keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" | base64 --decode > "$RUNNER_TEMP/videokeeper-release.jks"
          test -s "$RUNNER_TEMP/videokeeper-release.jks"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/videokeeper-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Check APK and signing certificate
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p release
          cp "$APK" "release/VideoKeeper-${{ steps.tag.outputs.tag }}.apk"
          (cd release && sha256sum "VideoKeeper-${{ steps.tag.outputs.tag }}.apk" > SHA256SUMS.txt)
          cp docs/RELEASE_NOTES_v1.0.0.md release/更新日誌與安裝說明.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" release/* \
            --title "影片管家 ${{ steps.tag.outputs.tag }}" \
            --notes-file docs/RELEASE_NOTES_v1.0.0.md \
            --verify-tag
